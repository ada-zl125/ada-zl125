name: Update README stats card

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=ada-zl125&show_icons=true&hide_title=true&hide_border=true&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN }}
          fail_on_error: true

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "chore: update GitHub stats card" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
